# Default settings for the awg-exporter deploy.
# Any key can be overridden from the command line: --data key=value

# --- Installation ---

# Local path to the exporter binary (relative paths are resolved from the repo root)
binary_src = "awg-exporter"
# Build the binary with build.sh (needs Docker) before deploying:
#   auto   - when sources are newer than the binary or it is missing
#   always - on every run (once per run, not per host)
#   never  - deploy binary_src as is (required for a custom binary_src)
build = "auto"
binary_dest = "/usr/local/bin/awg-exporter"
config_dest = "/etc/awg-exporter"
service_name = "awg-exporter"

# User the service runs as. It is created as a system user and added to
# `service_groups` (docker socket access is required). Use "root" to skip creating it.
service_user = "awg-exporter"
service_groups = ["docker"]

# --- Exporter settings (rendered into the EnvironmentFile) ---

# Seconds between `awg show` polls
scrape_interval = 60

# Metrics HTTP listener (only in "http" mode)
http_host = "127.0.0.1"
http_port = 9351
ops_mode = "http"

# Optional HTTP basic auth; enabled when both are set
http_auth_user = ""
http_auth_password = ""

# --- TLS ---
# Paths on the local machine; relative ones are resolved from the repo root.

tls_enabled = false
# Directory on the host where the certificate and key are installed
tls_dest_dir = "/etc/ssl/awg-exporter"

# Either upload an existing certificate (PEM, full chain) and key ...
tls_cert = ""
tls_key = ""

# ... or generate one signed by the given CA (the CA key stays local)
tls_generate = false
tls_ca_cert = ""
tls_ca_key = ""
tls_ca_key_password = ""
# DNS names / IPs for the certificate; empty = the host address used for SSH
tls_san = []
tls_days = 365
# Generated certificates are cached here, one subdirectory per host
tls_cache_dir = "deploy/certs"

# Docker container running AmneziaWG
container_name = "amnezia-awg"
awg_show_exec = "wg show all"

# Resolve peer keys to client names via the Amnezia clients table inside the container
clients_table_enabled = true
clients_table_file = "/opt/amnezia/awg/clientsTable"

# Docker socket; empty = exporter default (unix:///var/run/docker.sock)
docker_host = ""

# Go soft memory limit; empty = exporter default (10MiB)
gomemlimit = ""
